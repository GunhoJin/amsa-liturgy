<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>주일미사 봉사자 배정</title>
  <script src="https://accounts.google.com/gsi/client" async></script>
  <style>
    @font-face { font-family: 'DNFBitBitv2'; font-display: swap;
      src: url('https://cdn.df.nexon.com/img/common/font/DNFBitBitv2.otf') format('opentype'); }
    @font-face { font-family: 'NeoDunggeunmo'; font-display: swap;
      src: url('https://cdn.jsdelivr.net/npm/@kfonts/neodgm@0.5.0/neodgm.woff2') format('woff2'); }
    :root { --accent: #2d8cf0; --ink: #323232; --sub: #666; --card: lightgrey; --bg: #f4f4f0; --error: #d63031; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'NeoDunggeunmo', 'Malgun Gothic', sans-serif;
      font-size: 16px; font-synthesis: none; -webkit-font-smoothing: none; }
    main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 16px; }
    h1 { margin: 0 0 8px; font-family: 'DNFBitBitv2', 'NeoDunggeunmo', sans-serif; font-weight: 400; font-size: 32px;
      text-align: center; text-shadow: 3px 3px 0 var(--accent); }
    .sub { margin: 0 0 28px; color: var(--sub); text-align: center; }
    .card { width: 100%; max-width: 340px; padding: 24px 20px; display: flex; flex-direction: column; align-items: center; gap: 18px;
      background: var(--card); border: 2px solid var(--ink); border-radius: 5px; box-shadow: 4px 4px var(--ink); text-align: center; }
    .card h2 { margin: 0; font-family: 'DNFBitBitv2', 'NeoDunggeunmo', sans-serif; font-weight: 400; font-size: 21px; }
    .account { width: 100%; padding: 10px; background: #fff; border: 2px solid var(--ink); border-radius: 5px; box-shadow: 4px 4px var(--ink);
      word-break: break-all; }
    .account small { display: block; color: var(--sub); margin-bottom: 4px; }
    input { width: 100%; height: 40px; padding: 5px 10px; border: 2px solid var(--ink); border-radius: 5px; box-shadow: 4px 4px var(--ink);
      font: inherit; outline: none; background: #fff; }
    input:focus { border-color: var(--accent); }
    .btn { min-width: 160px; height: 42px; padding: 0 16px; border: 2px solid var(--ink); border-radius: 5px; box-shadow: 4px 4px var(--ink);
      background: var(--accent); color: #fff; font: inherit; cursor: pointer; text-decoration: none;
      display: inline-flex; align-items: center; justify-content: center; }
    .btn.plain { background: #fff; color: var(--ink); }
    .btn:active { box-shadow: 0 0 var(--ink); transform: translate(3px, 3px); }
    .btn:disabled { opacity: .5; cursor: default; }
    .msg { min-height: 1.2em; line-height: 1.6; }
    .msg.error { color: var(--error); }
    #gbtn { min-height: 44px; }
    .hint { max-width: 340px; margin-top: 24px; color: var(--sub); line-height: 1.7; text-align: center; }
  </style>
</head>
<body>
<main>
  <h1>주일미사 봉사자 배정</h1>
  <p class="sub">암사동성당 주일학교 전례부</p>

  <div class="card">
    <h2 id="heading">입장하기</h2>
    <p id="intro" style="margin:0;line-height:1.6">구글 계정을 선택하면<br>승인된 계정은<br>배정표로 이동합니다.</p>
    <div id="gbtn"></div>
    <div class="account" id="account" hidden><small>선택한 구글 계정</small><span id="email"></span></div>
    <input id="name" placeholder="이름 (예: 홍길동)" maxlength="40" hidden aria-label="이름">
    <button class="btn" id="request" hidden>접근 요청 보내기</button>
    <a class="btn" id="open" hidden>배정표 열기</a>
    <button class="btn plain" id="switch" hidden>다른 계정 선택</button>
    <div class="msg" id="msg" role="status"></div>
  </div>

  <p class="hint">처음이면 계정을 선택한 뒤 <b>접근 요청</b>을 보내 주세요.<br>승인되면 메일로 알려드립니다.</p>
</main>

<script>
  // ── 설정 ──
  const CLIENT_ID = '977226801498-33q8sggagt2280osekqd2tj2ddgnh5eu.apps.googleusercontent.com';  // Google Cloud OAuth 클라이언트 ID (웹)
  const API_URL = 'https://script.google.com/macros/s/AKfycbwGoXNrxsZsINHPOP7efP8Rq6xgimiVoQlmklX1F4QpWGkS0kZjLNIiEeEoYXPZh9MQ/exec';

  const $ = id => document.getElementById(id);
  let token = null;

  function show(id, on) { $(id).hidden = !on; }
  function setMsg(text, isError) { $('msg').textContent = text || ''; $('msg').className = 'msg' + (isError ? ' error' : ''); }
  function emailFromToken(t) {
    try {
      const b = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      return JSON.parse(decodeURIComponent(escape(atob(b)))).email || '';
    } catch (e) { return ''; }
  }

  async function api(action, extra) {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action, token }, extra || {})),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || '요청을 처리하지 못했습니다.');
    return data;
  }

  function resetToChooser() {
    token = null;
    ['account', 'name', 'request', 'open', 'switch'].forEach(id => show(id, false));
    show('gbtn', true); show('intro', true);
    $('heading').textContent = '입장하기';
    setMsg('');
    google.accounts.id.disableAutoSelect();
  }

  async function onCredential(resp) {
    token = resp.credential;
    $('email').textContent = emailFromToken(token);
    show('gbtn', false); show('intro', false); show('account', true); show('switch', true);
    $('heading').textContent = '확인 중…';
    setMsg('');
    try {
      const st = await api('status');
      if (st.approved) {
        $('heading').textContent = '승인된 계정입니다';
        $('open').href = st.siteUrl;
        show('open', true);
        setMsg('배정표로 이동합니다…');
        location.href = st.siteUrl;
        return;
      }
      $('heading').textContent = '접근 요청';
      show('name', true); show('request', true);
      setMsg('아직 승인되지 않은 계정입니다.');
    } catch (e) {
      $('heading').textContent = '오류';
      setMsg(e.message, true);
    }
  }

  $('request').onclick = async () => {
    const name = $('name').value.trim();
    if (!name) { setMsg('이름을 입력해 주세요.', true); $('name').focus(); return; }
    $('request').disabled = true;
    setMsg('요청을 보내는 중…');
    try {
      const r = await api('request', { name });
      if (r.approved) { location.href = r.siteUrl; return; }
      $('heading').textContent = '요청 완료';
      show('name', false); show('request', false);
      setMsg(r.message);
    } catch (e) {
      $('request').disabled = false;
      setMsg(e.message, true);
    }
  };
  $('switch').onclick = resetToChooser;

  window.onload = () => {
    google.accounts.id.initialize({
      client_id: CLIENT_ID,
      callback: onCredential,
      auto_select: true,              // 이전에 고른 계정이면 자동 로그인 → 승인 계정은 바로 이동
      use_fedcm_for_prompt: true,
    });
    google.accounts.id.renderButton($('gbtn'), { theme: 'outline', size: 'large', text: 'continue_with', locale: 'ko', width: 260 });
    google.accounts.id.prompt();
  };
</script>
</body>
</html>
